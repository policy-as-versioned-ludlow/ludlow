id: ludlow
name: Ludlow Plan Administration, the employer's own seat
party: employer
pays: This institution's own balance sheet. Suppressed administration fees, the incident
  response bill, the regulator's settlement and the class action all land here, and
  this is the only seat this overlay carries.
values:
  plan-administration-fees:
    evidence_grade: 3
    basis: Published comparable filing, grade 3, not observed here. ELV Form10-K2025
      SEC0001156039-26-000013, service fees8475000000USD / operating revenue197584000000USD,
      members45232000 and headcount97100 at2025-12-31. https://www.sec.gov/Archives/edgar/data/1156039/000115603926000013/elv-20251231.htm.
      Native USD amount; GBP requires a signature-verified FX feed for the filing
      date.
    amount: 8475000000
    derived_from_party_fact: size.turnover
    share_of_turnover: 0.04289314924285367
    periods_per_year: 1
  accreditation-standing:
    evidence_grade: 5
    basis: Asserted, not measured. No evidenced causal path runs from accreditation
      standing to administration fees in this overlay, so it carries no amount and
      travels as a register entry instead.
ruin:
  cannot-adjudicate-claims: Claims adjudication unable to run for a full business
    day. Ruin for this seat is not insolvency but the loss of the function the plan
    is administered to perform, and members waiting on benefit decisions are the ones
    who carry it.
cash_flow:
- plan-administration-fees
note: The currency of these valuations is declared in ../../../currency.yaml until
  the twin's closed `valuation` schema gains a currency field (ticket 11 answer item
  2).
