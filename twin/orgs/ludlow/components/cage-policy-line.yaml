id: cage-policy-line
name: The pinned cage policy line
kind: practice
evolution: custom-built
visibility: 0.30
description: >-
  The platform implementations package this repo pins (gitops/platform/platform-pin.yaml, mirrored
  in party.yaml inherits[]). It is a practice rather than an activity: what it does is hold the
  claims namespace at a declared tier, and it moves only by a merged pin bump. This institution
  carries the tightest appetite in the estate, so the same control that Audits elsewhere is
  enforced here.
