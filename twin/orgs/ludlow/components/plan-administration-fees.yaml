id: plan-administration-fees
name: Plan administration fees
kind: capability
evolution: commodity
visibility: 0.84
description: >-
  The declared cash flow. Money crosses here and nowhere else in this overlay, so this is the only
  component an impact could price through at the institution's declared pricing threshold.
  ../perspectives/ludlow.yaml records the native USD amount derived from party.yaml turnover;
  reporting that amount in GBP requires a matching signed FX instrument for the filing date.
