id: penalty-published-2026
question: >-
  When the supervising regulator publishes an enforcement action under a regime this institution is
  subject to, what does the publication itself do to plan administration fees -- employers moving
  their plan, members lost at renewal -- over the horizon?
proposition: a-regulator-publishes-a-penalty-under-a-regime-in-force
at: '2026-09-04'
horizon: '2027-09-04'
components:
  - published-enforcement-record
  - member-record-store
  - plan-administration-fees
world_models:
  - reference-map
class: penalty-published
note: >-
  The seam, and it is structural rather than a promise: this scenario prices the consequence on
  the value chain and never the fine. The amount of a fine is computed by the estate from the
  regulator's own published penalty schema, through composition and `prices[]`; a number for it
  here would be the same fine priced twice by two engines answering the same question (ADR-0021).

  The declared native filing and share derive the perspective's amount. Both valuation
  and loss mechanism remain grade 3, admitted by this party's explicit pricing threshold 3.
  The comparable regulatory record is not this institution's observed incident. Its native USD cash flow reaches GBP only through the signed FX instrument
  matching the 2025-12-31 valuation date; a missing dated rate is a missing instrument. Grade-5 mitigation remains
  unpriced; publishing this standing question does not record a new enforcement event.
affected_parties:
  - id: the-members-the-action-is-for
    who: The plan members whose records the enforcement action would be taken over, not represented in this model.
    consequence: A publication this scenario forecasts is priced as this institution's lost administration fees; the twin carries no perspective for the people the regulator acted on behalf of.
