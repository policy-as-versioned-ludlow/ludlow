name: shift-left policy check

# Ticket mo-10: platform/shift-left/ci-check.py (see platform's own README)
# run for real, cross-org -- ludlow and platform checked out side by side
# in one run, TWO SEPARATE GitHub orgs, no monorepo assumption. This is the
# real shape `ci-workflow.example.yml` in the platform repo documents; this
# file is that shape actually wired into an institution's own CI, as that
# file says every institution must do for itself. Adapted from driftwood's
# copy of the same file, the first institution this was wired into.
#
# No `paths:` filter: this check must report a status on every PR (including
# a Renovate bump PR that only touches gitops/platform/platform-pin.yaml, not
# deploy/pod.yaml) -- a required check gated by `paths:` never runs on a PR
# that doesn't touch those paths, and GitHub then blocks the merge forever
# waiting on a status that was never going to arrive (the same gotcha
# faithful-floor ticket 12 hit and fixed the same way).
#
# Ticket mo-10 follow-up (2026-08-21): a green check on this job used to be
# the whole signal. That is not independently verifiable by a human reviewer
# -- it says "GitHub ran a job", not "the gate actually ran and passed". The
# steps after the gate build a small JSON attestation, sign it keyless (same
# Fulcio-from-Actions-OIDC, logged-to-Rekor pattern cut-release.yml already
# proves out for release tags) and post the signed result as a PR comment,
# so the reviewer can verify the check independently of trusting the badge.
#
# Ticket cs-28: two live bugs fixed below, plus a new, separate adopter
# gate. This job used to check out platform's DEFAULT BRANCH, not the tag
# under review -- the "version cross-check gate" step below was comparing
# ludlow's workload against whatever platform happened to have on `main`
# right now, never against the release this PR is actually proposing to
# adopt. The platform checkout now follows the tag THIS PR's own
# gitops/platform/platform-pin.yaml names, read from the PR head, and a
# later step refuses unless that tag's resolved commit matches the pinned
# `commit` field exactly -- ADR-0001's belt-and-braces pin becomes
# load-bearing instead of decorative. The adopter-gate steps near the
# bottom of this job are new and separate from `ci-check.py`: they verify
# platform's own cs-27 evidence (signed, identity-pinned, offline) and
# compute this institution's own composed bump across the pinned policy
# version array -- they do not replace or change the existing gate above.
#
# Ticket cs-29: the adopter gate renders platform's verified evidence INTO
# THE PULL REQUEST BODY ITSELF -- the literal thing the ticket's title and
# first acceptance-criterion line name. adopter_gate.py wraps that rendered
# Markdown between two HTML-comment markers (SECTION_START/SECTION_END); the
# step below fetches the PR's CURRENT body (via `gh pr view --json body`),
# replaces whatever sits between those markers if they're already present
# (a re-run on the same PR), or appends the marked section if this is the
# first run, then writes the result back with `gh pr edit --body-file`.
# Earlier drafts of this ticket posted a PR COMMENT instead, reasoning that
# Renovate authors and can overwrite the PR body on its own re-runs -- a
# reviewer correctly flagged that as not satisfying the ticket's own words.
# That risk doesn't actually apply here: this job is triggered BY a
# `pull_request` event, which fires only after Renovate has already pushed
# and settled its own body content for that push, so this step always reads
# and splices onto text Renovate already finished writing, never races it.

on: [pull_request]

# Extra permissions past the read-only default: the attestation step signs
# keyless via this run's own Actions identity (needs the ambient OIDC
# credential), and the comment step posts to the pull request. An explicit
# permissions block zeroes every unlisted permission rather than defaulting
# it, so both lines below are real grants, not restating what already held.
permissions:
  contents: read
  id-token: write
  pull-requests: write

# Ticket cs-28: the institution's own expected-identity constant for
# verifying PLATFORM's evidence signature (cs-27's cosign bundle, signed
# from platform's cut-release.yml run). This is a SEPARATE constant from
# release.yml's own EXPECTED_IDENTITY_REGEXP (ticket cs-14) -- that one
# verifies THIS repo's own cut-release.yml identity on ludlow's own release
# tags; this one verifies PLATFORM's cut-release.yml identity on platform's
# evidence. Same anchoring rule ticket cs-14 established: both ends
# anchored (^...$), every literal `.` escaped, main or a release/<major>.
# <minor>.x maintenance branch. Held here as a literal, not read from
# anything platform supplies at verification time -- a platform workflow
# rename breaks this on purpose, and a human re-decides who this repo
# trusts. ADOPTER_GATE_ISSUER matches release.yml's own EXPECTED_ISSUER
# value exactly (the same Sigstore public-good OIDC issuer every keyless
# signature in this estate authenticates against).
env:
  ADOPTER_GATE_IDENTITY_REGEXP: ^https://github\.com/policy-as-versioned-platform/platform/\.github/workflows/cut-release\.yml@refs/heads/(main|release/[0-9]+\.[0-9]+\.x)$
  ADOPTER_GATE_ISSUER: https://token.actions.githubusercontent.com

jobs:
  shift-left:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ludlow
          ref: ${{ github.event.pull_request.head.sha }}

      - name: fetch this PR's base commit too (ticket cs-28 needs the OLD platform pin, not just the new one)
        run: git -C ludlow fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: read the platform tag THIS PR proposes (from the PR head's own platform-pin.yaml -- bug #1 fix)
        id: pin
        run: |
          set -euo pipefail
          tag=$(grep -m1 -oE 'tag: v[0-9]+\.[0-9]+\.[0-9]+' ludlow/gitops/platform/platform-pin.yaml | awk '{print $2}')
          [ -n "$tag" ] || { echo "FAIL: could not read spec.ref.tag from ludlow/gitops/platform/platform-pin.yaml" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "platform-pin.yaml (PR head) proposes tag: $tag"

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          path: platform
          ref: ${{ steps.pin.outputs.tag }}
          fetch-depth: 0

      - name: party artefact check (ticket 11) -- schema, pinned tags, baseline mirror
        # platform/party/party_artefact.py, called through the pinned platform
        # dependency this job already checked out above -- the same "library,
        # not a service" shape ci-check.py uses. Refuses if party.yaml is
        # structurally invalid, if a declared implementations/controls version
        # disagrees with what gitops/platform/platform-pin.yaml or
        # gitops/flux-system/gotk-sync-nist.yaml actually pin, or if
        # gitops/apps/nist-pin-configmap.yaml's baselineName disagrees with
        # party.yaml's own baseline.
        #
        # platform-pin.yaml still pins v0.1.0, a tag cut before platform/party/
        # existed -- skip (not fail) until platform ships a tag that has it and
        # this pin is bumped, so this required check doesn't hard-block every
        # PR in the gap between landing ticket 11 here and platform releasing.
        run: |
          set -euo pipefail
          if [ ! -f platform/party/party_artefact.py ]; then
            echo "SKIP: platform/party/party_artefact.py isn't in the pinned platform tag (${{ steps.pin.outputs.tag }}) yet -- party/ ships once platform cuts a release that includes it and this repo's platform-pin.yaml is bumped to that tag (ticket 11)." >&2
            exit 0
          fi
          pip install --quiet pyyaml
          python3 platform/party/party_artefact.py check ludlow/party.yaml --adopter-dir ludlow

      - name: install pinned kyverno cli (binary + checksum, no marketplace action)
        env:
          KYVERNO_VERSION: 1.18.2
          KYVERNO_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
        run: |
          set -euo pipefail
          curl -sSL -o kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
          tar xzf kyverno.tar.gz kyverno && chmod +x kyverno && sudo mv kyverno /usr/local/bin/kyverno
          pip install --quiet pyyaml

      - name: version cross-check gate
        run: python3 platform/shift-left/ci-check.py --resource ludlow/deploy/pod.yaml

      - name: install pinned cosign (binary + checksum, no marketplace action)
        env:
          COSIGN_VERSION: 3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          set -euo pipefail
          curl -sSL -o cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/cosign

      - name: build the shift-left attestation
        # Only reached if the gate step above exited 0 -- the attestation
        # claims "pass" because a non-zero ci-check.py already stopped the
        # job before this step runs.
        run: |
          set -euo pipefail
          printf '{\n' > attestation.json
          printf '  "pr_number": %s,\n' "${{ github.event.pull_request.number }}" >> attestation.json
          printf '  "head_sha": "%s",\n' "${{ github.event.pull_request.head.sha }}" >> attestation.json
          printf '  "gate": "shift-left",\n' >> attestation.json
          printf '  "result": "pass",\n' >> attestation.json
          printf '  "run_id": "%s",\n' "${{ github.run_id }}" >> attestation.json
          printf '  "run_url": "%s"\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> attestation.json
          printf '}\n' >> attestation.json
          cat attestation.json

      - name: sign the attestation keyless (Fulcio cert from this run's own OIDC identity, logged to Rekor)
        run: cosign sign-blob --yes --bundle attestation.cosign.bundle attestation.json

      - name: post the signed attestation as a PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### shift-left gate: signed attestation"
            echo
            echo "\`platform/shift-left/ci-check.py\` passed for this PR. The JSON below is"
            echo "signed keyless -- a Fulcio certificate bound to this run's own GitHub"
            echo "Actions OIDC identity, logged to the public Rekor transparency log -- so"
            echo "this is an independently verifiable 'this was checked' signal, not just a"
            echo "green status badge."
            echo
            echo '```json'
            cat attestation.json
            echo '```'
            echo
            echo "Signature bundle (certificate + signature + Rekor log entry -- verify with"
            echo "\`cosign verify-blob --bundle attestation.cosign.bundle ...\`):"
            echo
            echo '```json'
            cat attestation.cosign.bundle
            echo '```'
          } > pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file pr-comment.md

      # Ticket cs-28 from here down: a new, separate adopter gate. Does not
      # replace anything above -- ci-check.py already ran, against the
      # correct tag now that the checkout above follows this PR's own pin.
      #
      # adopter_gate.py does bug #2's own check itself (the checked-out
      # platform tag must resolve to the pinned `commit` field, or refuse)
      # as its very first move, alongside the pin diff, the evidence
      # verification and the composed-bump math -- see that script's own
      # module docstring. No separate YAML step duplicates it here.

      - name: adopter gate -- verify pin, verify platform's evidence, compose this institution's own bump (ticket cs-28)
        id: adopter-gate
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          set +e
          python3 ludlow/.github/scripts/adopter_gate.py \
            --ludlow-dir ludlow \
            --platform-dir platform \
            --old-ref "${{ github.event.pull_request.base.sha }}" \
            --new-ref "${{ github.event.pull_request.head.sha }}" \
            --out-comment adopter-gate-comment.md \
            --identity-regexp "${ADOPTER_GATE_IDENTITY_REGEXP}" \
            --issuer "${ADOPTER_GATE_ISSUER}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0   # never fail THIS step -- the evidence must land in the pull request body either way; the next step enforces the verdict

      - name: render the adopter-gate evidence into the pull request BODY (ticket cs-29 -- the body itself, see header)
        if: always() && steps.adopter-gate.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json body -q .body > current-body.md
          python3 ludlow/.github/scripts/adopter_gate.py --splice-body \
            --current-body current-body.md --section adopter-gate-comment.md --out-body new-body.md
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file new-body.md

      - name: fail the required check if the adopter gate refused
        if: steps.adopter-gate.outputs.exit_code != '0'
        run: |
          echo "FAIL: the adopter gate refused this pull request -- see the adopter-gate section of this pull request's own BODY (spliced in by the previous step, ticket cs-29) for the composed bump and the verified evidence." >&2
          exit 1

  compose-check:
    # Ticket 18 (policy-composition): each adopter's shift-left check
    # recomposes on every pull request -- not just a Renovate bump PR, any
    # PR, so this job also has no `paths:` filter, exactly the shift-left
    # job's own reasoning above. It regenerates the composed artefact and
    # the evidence document (ticket 12), fails on any diff against the
    # committed copies, fails on refusal, and prints the document as the
    # job summary (spec.md: "a refusal is the most valuable output the gate
    # produces").
    #
    # Three parents checked out at ludlow's own pinned tags: platform
    # (implementations + threat, same pin shift-left's own job reads), nist
    # (controls, gitops/flux-system/gotk-sync-nist.yaml), and ico (pricing --
    # no Flux/Renovate pin exists for this kind anywhere in this estate
    # today, party_artefact.py's own NOTE says so plainly, so it checks out
    # at its default branch, matching composition.py's own unpinned-parent
    # handling).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: ludlow }

      - name: read ludlow's own pinned platform and nist tags
        id: pins
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 ludlow/.github/scripts/adopter-gate.py read-pin \
            ludlow/gitops/platform/platform-pin.yaml | sed 's/^/platform_/' >> "$GITHUB_OUTPUT"
          python3 ludlow/.github/scripts/adopter-gate.py read-pin \
            ludlow/gitops/flux-system/gotk-sync-nist.yaml | sed 's/^/nist_/' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          fetch-depth: 0
          path: platform
          ref: ${{ steps.pins.outputs.platform_tag }}

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-nist/nist
          fetch-depth: 0
          path: nist
          ref: ${{ steps.pins.outputs.nist_tag }}

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-ico/ico
          fetch-depth: 0
          path: ico
          ref: main

      - name: recompose ludlow's party artefact; fail on refusal or drift; print the document as the job summary
        run: |
          set -uo pipefail
          pip install --quiet pyyaml
          python3 platform/compose/composition.py compose ludlow --estate-clone . --out ludlow \
            2>&1 | tee compose-output.json
          status=${PIPESTATUS[0]}
          {
            echo "## composition check"
            echo
            echo '```json'
            cat compose-output.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::composition refused -- see the job summary for the full document"
            exit 1
          fi
          drift="$(git -C ludlow status --porcelain -- composed/)"
          if [ -n "$drift" ]; then
            echo "::error::the regenerated composed artefact differs from the committed copy under ludlow/composed/"
            echo "$drift"
            git -C ludlow --no-pager diff -- composed/ | head -400
            exit 1
          fi
          echo "composed artefact matches the committed copy -- no drift"
